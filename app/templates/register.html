{% extends 'base.html' %}

{% block title %}Register | MET Research Platform{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-16rem)] py-6 animate-in fade-in zoom-in-95 duration-300">
    
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 max-w-sm w-full rounded-2xl shadow-xl p-6 relative flex flex-col gap-4">
        
        <div class="text-center space-y-1">
            <h1 class="font-display font-semibold text-xl text-slate-900 dark:text-white">Create Account</h1>
            <p class="text-xs text-slate-555">Sign up to begin auditing claims and tracking evolution.</p>
        </div>
        
        <form id="register-form" class="space-y-3.5" onsubmit="event.preventDefault(); handleRegisterSubmit();">
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-450 dark:text-slate-500 mb-1" for="reg-fullname">Full Name</label>
                <input type="text" id="reg-fullname" required class="w-full px-3.5 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-200" placeholder="John Doe">
            </div>
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-450 dark:text-slate-500 mb-1" for="reg-email">Email Address</label>
                <input type="email" id="reg-email" required class="w-full px-3.5 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-955 focus:outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-200" placeholder="john@example.com">
            </div>
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-450 dark:text-slate-500 mb-1" for="reg-password">Password</label>
                <div class="relative">
                    <input type="password" id="reg-password" required class="w-full pl-3.5 pr-10 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-200" placeholder="••••••••">
                    <button type="button" onclick="togglePasswordVisibility('reg-password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-350 focus:outline-none" aria-label="Toggle Password Visibility">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </button>
                </div>
            </div>
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-450 dark:text-slate-500 mb-1" for="reg-confirm">Confirm Password</label>
                <div class="relative">
                    <input type="password" id="reg-confirm" required class="w-full pl-3.5 pr-10 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-200" placeholder="••••••••">
                    <button type="button" onclick="togglePasswordVisibility('reg-confirm', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-350 focus:outline-none" aria-label="Toggle Password Visibility">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </button>
                </div>
            </div>
            
            <button id="register-submit-btn" type="submit" class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow-lg shadow-indigo-500/10 transition-premium mt-3 flex items-center justify-center gap-2">
                <span>Register & Sign In</span>
            </button>
        </form>
        
        <div class="text-center text-xs text-slate-555 border-t border-slate-100 dark:border-slate-855 pt-3 mt-2">
            Already have an account? 
            <a href="/login" class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">Sign In here</a>
        </div>
        
    </div>

</div>

<script>
    function togglePasswordVisibility(inputId, button) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            button.innerHTML = `
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path></svg>
            `;
        } else {
            input.type = 'password';
            button.innerHTML = `
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            `;
        }
    }

    function handleRegisterSubmit() {
        const full_name = document.getElementById('reg-fullname').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value.trim();
        const confirm_password = document.getElementById('reg-confirm').value.trim();
        const btn = document.getElementById('register-submit-btn');

        if (!full_name || !email || !password || !confirm_password) {
            Toast.show('All fields are required.', 'warning');
            return;
        }

        if (password.length < 8) {
            Toast.show('Password must be at least 8 characters long.', 'warning');
            return;
        }

        if (password !== confirm_password) {
            Toast.show('Passwords do not match.', 'error');
            return;
        }

        Loader.show();
        btn.disabled = true;
        btn.innerHTML = `
            <svg class="animate-spin -ml-1 mr-3 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Registering...</span>
        `;

        fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ full_name, email, password, confirm_password })
        })
        .then(res => res.json())
        .then(data => {
            Loader.hide();
            btn.disabled = false;
            btn.innerHTML = '<span>Register & Sign In</span>';
            
            if (data.success) {
                localStorage.setItem('access_token', data.data.access_token);
                Toast.show('Account created successfully! Welcome to MET.', 'success');
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 800);
            } else {
                Toast.show(data.message || 'Registration failed.', 'error');
            }
        })
        .catch(err => {
            Loader.hide();
            btn.disabled = false;
            btn.innerHTML = '<span>Register & Sign In</span>';
            Toast.show(`Connection Error: ${err.message}`, 'error');
        });
    }

    window.addEventListener('load', () => {
        if (localStorage.getItem('access_token')) {
            window.location.href = '/dashboard';
        }
    });
</script>
{% endblock %}
